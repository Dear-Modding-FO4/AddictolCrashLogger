[General]
bEnableCrashLogger=true
bPrintSettings=true
iMaxCrashLogs=20
iMaxMiniDumps=1

[Directories]
sCrashLogDirectory=
sSymcacheDirectory=C:\symcache

[Debugging]
bWaitForDebugger=false
bFullMemoryMiniDump=false
bCrashLogWriteMiniDump=false
bThreadDumpWriteMiniDump=false
bHeapAnalysis=false
iMaxHeapsToCheck=1
iMaxHeapIterationsPerHeap=1000

[Hotkeys]
bEnableThreadDumpHotkey=false				; Ctrl + Shift + F12
