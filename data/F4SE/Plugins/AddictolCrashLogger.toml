# ADDICTOL CRASH LOGGER FALLOUT 4 PLUGIN SETTINGS

[General]

# Master toggle for the Crash Logger.
# If disabled, no crash logs or minidumps will be generated.
# Changes take effect on the next game launch.
bEnableCrashLogger = true

# If enabled, Addictol's settings will be printed in crash logs.
# Changes take effect on the next game launch.
bPrintSettings = true

# If enabled, newly created crash and thread-dump logs are opened automatically.
# This is the existing headless behavior and does not use DearModdingUI.
# Changes take effect on the next game launch.
bAutoOpenLogs = false

# Maximum number of logs to keep separately for crash- and threaddump- families.
# Cleanup runs when a report is created and can also remove that log's paired dump.
# Zero or a negative value means unlimited. Changes take effect on the next game launch.
iMaxCrashLogs = 20

# Maximum number of minidumps to keep separately for each report family.
# Zero or a negative value means unlimited. Changes take effect on the next game launch.
iMaxMiniDumps = 1


[Directories]

# Directory where crash logs and minidumps are stored.
# If empty: %USERPROFILE%\Documents\My Games\Fallout4\F4SE
# An unavailable configured directory falls back for that session without rewriting this value.
# Changes take effect on the next game launch.
sCrashLogDirectory = ""

# Directory for symbol cache storage.
# Changes take effect on the next game launch.
sSymcacheDirectory = "C:\\symcache"


[Debugging]

# If enabled, waits for a debugger to attach when a crash occurs.
# This intentionally prevents ordinary crash completion until a debugger attaches.
# Changes take effect on the next game launch.
bWaitForDebugger = false

# If enabled, minidumps will include full memory.
# Warning: This can produce a very large minidump containing sensitive process memory.
# Changes take effect on the next game launch.
bFullMemoryMiniDump = false

# If enabled, minidumps will be written alongside crash logs.
# Changes take effect on the next game launch.
bCrashLogWriteMiniDump = false

# If enabled, manual thread reports capture one Process Snapshot (PSS) and write
# a minidump from that same snapshot before bounded read-only analysis.
# Handle data is included only for this requested dump.
# Changes take effect on the next game launch.
bThreadDumpWriteMiniDump = false

[Hotkeys]

# If enabled, Ctrl + Shift + F12 triggers one PSS-backed manual thread report.
# Threads are not individually suspended or recaptured.
# The chord is fixed in this release. Changes take effect on the next game launch.
bEnableThreadDumpHotkey = false


[Pastebin]

# If enabled, the existing crash path uploads a newly written crash log to Pastebin.
# Reports may contain sensitive local data. This option remains file-configured only.
# Changes take effect on the next game launch.
bAutoUploadCrashLog = false

# Pastebin developer API key used only by the existing upload behavior.
# The in-game UI never displays or copies this value.
sPastebinAPIKey = ""
